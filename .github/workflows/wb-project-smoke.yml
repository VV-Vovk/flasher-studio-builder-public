name: WB complete project GNU smoke
on:
  push:
    branches: [main, 'develop/**']
    paths: ['tools/universal/wb_elf.py','tools/universal/wb_project.py','tools/universal/cubeide_gcc.py','tools/universal/stm32.py','tests/wb_project_smoke.py','tests/wb_web_contract.mjs','.github/workflows/wb-project-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - name: Provision GNU tools only
        run: bash tools/universal/setup-native.sh stm32cubeide-gcc system STM32WB55RGV6
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Fetch pinned public Web audit
        env:
          WEB_REF: 58b8f69b4e50e42152cb7689c7dfe684b90f0cb3
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/web"
          git -C "$RUNNER_TEMP/web" fetch --no-tags --depth=1 https://github.com/VV-Vovk/flasher-studio-web.git "$WEB_REF"
          git -C "$RUNNER_TEMP/web" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/web" rev-parse HEAD)" = "$WEB_REF"
          echo "FS_WB_WEB_AUDIT=$RUNNER_TEMP/web/public" >> "$GITHUB_ENV"
      - name: Real GNU build and CPU1 HEX bounds
        run: python3 tests/wb_project_smoke.py
