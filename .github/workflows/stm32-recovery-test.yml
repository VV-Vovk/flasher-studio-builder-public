name: STM32 FS10 Recovery application
on: workflow_dispatch
permissions: {contents: read}
jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - run: bash tools/universal/setup-native.sh stm32-bare system STM32F103C8T6
      - name: Compile relocated HAL/LL project
        run: |
          set -euo pipefail
          cp -r examples/stm32-source/mixed "$RUNNER_TEMP/src"
          find "$RUNNER_TEMP/src" -type f -exec sed -i 's/stm32f0xx/stm32f1xx/g' {} +
          echo '{"recoveryLayout":"fs10-stm32f103c8"}' > "$RUNNER_TEMP/src/flasher-native.json"
          (cd "$RUNNER_TEMP/src" && zip -qr "$RUNNER_TEMP/source.zip" .)
          python3 tools/universal/build.py --source "$RUNNER_TEMP/source.zip" --engine stm32-bare --native-target STM32F103C8T6 --work "$RUNNER_TEMP/work" --out "$RUNNER_TEMP/output" --request-id 00000000000000000000000000000000
          python3 - <<'PYCODE'
          import json,os,struct,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'output';m=json.loads((p/'manifest.json').read_text());b=(p/'firmware.bin').read_bytes();sp,pc=struct.unpack_from('<II',b)
          assert m['build']['recoveryLayout']['id']=='fs10-stm32f103c8'
          assert 8<=len(b)<=47*1024 and 0x20000000<sp<=0x20005000 and pc&1 and 0x08004000<=pc-1<0x08004000+len(b)
          ranges=next(x['ranges'] for x in m['flashLayout']['entries'] if x['file']=='firmware.hex')
          assert ranges[0]['start']==0x08004000 and all(x['endExclusive']<=0x0800fc00 for x in ranges)
          PYCODE
          arm-none-eabi-nm "$RUNNER_TEMP/output/firmware.elf" | grep ' T FlasherOriginalSystemInit$'
          arm-none-eabi-nm "$RUNNER_TEMP/output/firmware.elf" | grep ' T SystemInit$'