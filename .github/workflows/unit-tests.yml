name: Builder regression tests
on:
  push:
    paths: ['tools/**', 'tests/**', 'profiles/**', '.github/workflows/**']
  pull_request:
    paths: ['tools/**', 'tests/**', 'profiles/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Public repository payload guard
        run: python tools/check_public_tree.py
      - run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s tests/legacy -v
